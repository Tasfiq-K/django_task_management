{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet" />
  </head>
  <body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 space-y-6 bg-white dark:bg-gray-800 rounded-xl shadow-lg">
      <h2 class="text-2xl font-bold text-center text-gray-900 dark:text-white">{% block header %}{% endblock %}</h2>
      {% if messages %}
        {% for message in messages %}
          <div class="p-4 mb-4 text-sm text-{{ message.tags }}-700 bg-{{ message.tags }}-100 rounded-lg dark:bg-{{ message.tags }}-200 dark:text-{{ message.tags }}-800" role="alert">
            {{ message }}
            <button type="button" class="float-right text-{{ message.tags }}-500 hover:text-{{ message.tags }}-700" onclick="this.parentElement.remove()">
              <span class="sr-only">Close</span>
              &times;
            </button>
          </div>
        {% endfor %}
      {% endif %}
      {% block content %}
      {% endblock %}
    </div>
  </body>
</html>
