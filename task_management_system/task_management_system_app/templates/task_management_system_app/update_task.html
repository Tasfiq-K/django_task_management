<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Task</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  </head>
  <body>
    <div class="container mt-5">
      <h2 class="text-center">Update Task: {{ task.name }}</h2>
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <form method="post" id="updateTaskForm">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Task</button>
      </form>
      <a href="{% url 'task_management_system_app:user_tasks_list' %}" class="btn btn-secondary mt-3">Back to Tasks</a>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
      // Validate end date is after start date
      function validateEndDate() {
        const startDate = new Date(document.getElementById('id_start_date').value);
        const endDate = new Date(document.getElementById('id_end_date').value);
        const errorElement = document.getElementById('end_date_error');
        if (endDate <= startDate) {
          errorElement.innerText = 'End date must be after start date';
          return false;
        } else {
          errorElement.innerText = '';
          return true;
        }
      }

      // Add event listener to form submission
      document.getElementById('updateTaskForm').addEventListener('submit', function (event) {
        if (!validateEndDate()) {
          event.preventDefault(); // Prevent form submission if validation fails
        }
      });
    </script>
  </body>
</html>
